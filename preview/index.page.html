  --surface-container-lowest: var(--color-bg-1);
  --surface-container-low: var(--color-bg-2);
  --surface-container: var(--color-bg-2);
  --surface-container-high: var(--color-bg-2);
  --surface-container-highest: var(--color-bg-2);

  --inverse-surface: var(--color-text-primary);
  --inverse-on-surface: var(--color-text-inverse);
  --inverse-on-surface-variant: var(--color-text-inverse-disabled);
  --inverse-primary: var(--color-brand);

  --error: var(--color-error);
  --on-error: var(--color-text-inverse);
  --error-container: var(--color-message-bg-error);
  --on-error-container: var(--color-text-primary);

  --success: var(--color-success);
  --on-success: var(--color-text-inverse);
  --success-container: var(--color-message-bg-success);
  --on-success-container: var(--color-text-primary);

  --critical: var(--color-alert);

  --critical-container: var(--color-message-bg-alert);
  --on-critical-container: var(--color-text-primary);

  --warning: var(--color-warning);
  --on-warning: var(--color-text-inverse);
  --warning-container: var(--color-message-bg-warning);
  --on-warning-container: var(--color-text-primary);

  --info: var(--color-info-primary);
  --on-info: var(--color-text-inverse);
  --info-container: var(--color-message-bg-info);
  --on-info-container: var(--color-text-primary);

  --text-placeholder: var(--color-text-placeholder);
  --text-disabled: var(--color-text-disabled);
  --text-inverse-disabled: var(--color-text-inverse-disabled);

  --interactive-link: var(--color-link);
  --interactive-link-hover: var(--color-link-hover);
  --interactive-link-active: var(--color-link-active);
  --interactive-link-visited: var(--color-link-visited);
  --interactive-link-disabled: var(--color-link-disabled);
  
  --scrim: var(--color-bg-mask);
  --outline: var(--color-border);
  --outline-variant: var(--color-border-separator);
  --divider: var(--color-border-separator);
  --focus-ring: var(--color-border-focus);
  --selected: var(--color-border-focus);

  /* ── spacing → --spacing-* ── */
  --spacing-inline: var(--spacing-2);   /* 8px */
  --spacing-stack: var(--spacing-3);    /* 12px */
  --spacing-gutter: var(--spacing-4);  /* 16px */
  --spacing-inset: var(--spacing-6);    /* 24px */
  --spacing-section: var(--spacing-4); /* 16px */
  --spacing-page: var(--spacing-8);      /* 32px */

  /* ── boxShadow ── */
  --shadow-card: var(--shadow-sm);
  --shadow-popover: var(--shadow-lg);
  --shadow-modal: var(--shadow-xl);

  /* ── borderRadius → --radius-* ── */
  --radius-badge: var(--radius-base);  /* 4px */
  --radius-action: var(--radius-base); /* 4px */
  --radius-container: var(--radius-lg); /* 8px */
  --radius-overlay: var(--radius-lg);  /* 8px */

  /* ── border & outline width ── */
  --border-width-thin: 1px;    
  --border-width-thick: 2px;  
  --outline-width-focus: 1px;
  --outline-offset-gap: 2px;

  /* ── typography → --font-*（角色化 font 简写：字号/行高 字族；字重另行用 --font-weight-* 组合）── */
  /* Display 展示文本 — 英雄标语、数据看板大数字 */
  --font-display-l: var(--font-size-7xl)/var(--line-height-xs) var(--font-family);    /* 60px/1.25 */
  --font-display-m: var(--font-size-6xl)/var(--line-height-sm) var(--font-family);    /* 48px/1.375 */
  --font-display-s: var(--font-size-5xl)/var(--line-height-sm) var(--font-family);    /* 36px/1.375 */
  /* Headline 标题 — 页面区块标题(H3)→卡片标题→表单区标题 */
  --font-headline-l: var(--font-size-2xl)/var(--line-height-sm) var(--font-family);   /* 20px/1.375 */
  --font-headline-m: var(--font-size-xl)/var(--line-height-sm) var(--font-family);    /* 18px/1.375 */
  --font-headline-s: var(--font-size-lg)/var(--line-height-base) var(--font-family);  /* 16px/1.5 */
  /* Body 正文 — 表单标签/按钮文字→表格正文→辅助说明 */
  --font-body-l: var(--font-size-lg)/var(--line-height-base) var(--font-family);      /* 16px/1.5 */
  --font-body-m: var(--font-size-md)/var(--line-height-base) var(--font-family);      /* 14px/1.5 */
  --font-body-s: var(--font-size-base)/var(--line-height-md) var(--font-family);      /* 12px/1.625 */
  /* Caption 注释 — 时间戳/表格附加信息→底部免责声明 */
  --font-caption-m: var(--font-size-base)/var(--line-height-md) var(--font-family);   /* 12px/1.625 */
  --font-caption-s: var(--font-size-sm)/var(--line-height-lg) var(--font-family);    /* 10px/1.8 */
}

/* Cascader 组件样式（占位，待填充 token 映射） */
.ant-cascader-dropdown .ant-cascader-menu {
  height: auto;
  padding: 0.25rem;
  gap: 0.25rem;
  display: flex;
  flex-direction: column;
}
.ant-cascader-dropdown .ant-cascader-menu .ant-cascader-menu-item {
  padding: 0 0.5rem;
  height: 2rem;
  font-size: var(--font-size-md);
  color: var(--color-text-primary);
}
.ant-cascader-dropdown .ant-cascader-menu .ant-cascader-menu-item:hover {
  background-color: var(--color-hover);
}
.ant-cascader-dropdown .ant-cascader-menu .ant-cascader-menu-item.ant-cascader-menu-item-expand .ant-cascader-menu-item-expand-icon {
  color: var(--color-text-primary);
  font-size: var(--font-size-sm);
}
.ant-cascader-dropdown .ant-cascader-menu .ant-cascader-menu-item.ant-cascader-menu-item-disabled {
  color: var(--color-text-disabled);
}
.ant-cascader-dropdown .ant-cascader-menu .ant-cascader-menu-item.ant-cascader-menu-item-disabled .ant-cascader-menu-item-expand-icon {
  color: var(--color-text-disabled);
}
.ant-cascader-dropdown .ant-cascader-menu-item-active:not(.ant-cascader-menu-item-disabled),
.ant-cascader-dropdown .ant-cascader-menu-item-active:not(.ant-cascader-menu-item-disabled):hover {
  font-weight: normal;
  color: var(--color-text-on);
  background-color: var(--color-select);
}

.ant-select:not(.ant-select-customize-input) .ant-select-selector {
  border-color: var(--color-border);
}
.ant-tree-select-dropdown {
  padding: 0.25rem;
}
.ant-tree-select-dropdown .ant-select-tree {
  color: var(--color-text-primary);
  background-color: var(--color-bg-4);
  font-size: var(--font-size-md);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode {
  align-items: center;
  margin-bottom: unset;
  padding: 0.25rem 0;
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-checkbox {
  margin-block-start: unset;
  align-self: unset;
  border: 1px solid var(--color-icon-tertiary);
  border-radius: var(--radius-xs);
  background-color: var(--color-fill-subtle);
  color: var(--color-text-primary);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-checkbox .ant-select-tree-checkbox-inner {
  border: none;
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-checkbox.ant-select-tree-checkbox-checked {
  background-color: var(--color-brand);
  border-color: var(--color-brand);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-checkbox.ant-select-tree-checkbox-checked + .ant-select-tree-node-content-wrapper {
  background-color: var(--color-select);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-checkbox.ant-select-tree-checkbox-checked + .ant-select-tree-node-content-wrapper:hover {
  background-color: var(--color-select);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-checkbox.ant-select-tree-checkbox-indeterminate:after {
  background-color: var(--color-brand);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-checkbox.ant-select-tree-checkbox-indeterminate + .ant-select-tree-node-content-wrapper {
  background-color: var(--color-select);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-checkbox.ant-select-tree-checkbox-indeterminate + .ant-select-tree-node-content-wrapper:hover {
  background-color: var(--color-select);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-checkbox.ant-select-tree-checkbox-disabled {
  border: 1px solid var(--color-border-disabled);
  background-color: var(--color-fill-disabled-subtle);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode.ant-select-tree-treenode-disabled .ant-select-tree-node-content-wrapper {
  color: var(--color-text-disabled);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode:not(.ant-select-tree-treenode-disabled) .ant-select-tree-node-content-wrapper.ant-select-tree-node-selected {
  color: var(--color-text-on);
  background-color: var(--color-select);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode:not(.ant-select-tree-treenode-disabled) .ant-select-tree-node-content-wrapper.ant-select-tree-node-selected:hover {
  color: var(--color-text-on);
  background-color: var(--color-select);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode:not(.ant-select-tree-treenode-disabled) .ant-select-tree-node-content-wrapper:hover {
  color: var(--color-text-primary);
  background-color: var(--color-hover);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-node-content-wrapper {
  min-height: unset;
  border-radius: var(--radius-base);
  padding: 0.1875rem 0.5rem 0.1875rem 0.25rem;
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-node-content-wrapper .ant-select-tree-iconEle {
  width: 0.875rem;
  height: 0.875rem;
  vertical-align: baseline;
  margin-right: 0.5rem;
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode::before {
  display: none;
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-switcher {
  width: 1rem;
  height: 1rem;
  display: inline-flex;
  justify-content: center;
  align-self: unset;
  margin-inline-end: 0.5rem;
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-switcher .ant-select-tree-switcher-icon {
  height: 0.625rem;
  margin: auto;
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-switcher:before {
  display: none;
}

/* TimePicker/DatePicker 组件样式（antd 5 常规属性覆盖，原 --ant-* 变量方案改写） */
.ant-picker.ant-picker {
  color: var(--color-text-primary);
  border-color: var(--gray-20);
  border-radius: var(--radius-base);
  padding-left: 0.75rem;
  padding-right: 0.75rem;
  height: 2rem;
}
.ant-picker.ant-picker:not(.ant-picker-disabled):hover {
  border-color: var(--gray-90);
}
.ant-picker.ant-picker:focus-within,
.ant-picker.ant-picker.ant-picker-focused {
  border-color: var(--brand-50) !important;
  box-shadow: 0 0 0 1px var(--brand-10);
}
.ant-picker.ant-picker.ant-picker-disabled {
  color: var(--color-text-disabled) !important;

/* Table 组件样式（token 映射；单元格高度按尺寸区分，rem：大 2.5rem / 中 2rem / 小 1.75rem） */
.ant-table {
  font-family: var(--font-family) !important;
  /* antd 5.29 在 .ant-table 上设置了 scrollbar-color（ant-design#47486），且该属性会继承到 .ant-table-content；
     Chrome 121+ 中滚动元素上非 auto 的标准滚动条属性会让 ::-webkit-scrollbar 自定义样式全部失效，
     重置为 auto 以恢复 6px 自定义滚动条（含 base.css 的全局规则） */
  scrollbar-color: auto !important;
}
.ant-table .ant-table-content {
  border-start-start-radius: 0 !important;
  border-start-end-radius: 0 !important;
  /* 滚动条下移：横向滚动条渲染在 padding 之下，这里留出与表格的间距；负 margin 抵消无滚动条表格多占的空间 */
  padding-bottom: 2px;
  margin-bottom: -2px;
  /* 横向滚动条（scroll.x 的滚动容器就是 .ant-table-content，规则生效依赖上方 .ant-table 的 scrollbar-color 重置）
		   注意：Chromium 中 hover 改 ::-webkit-scrollbar 高度存在渲染滞后（需交互才刷新且不还原），
		   故轨道固定 8px；滑块用固定 2px 透明边框把可视区缩到 4px（内半径 = 4-2 = 2px，圆角生效），
		   hover 只切换 background-clip/颜色（纯绘制属性，即时生效）铺满 8px */
  /* 隐藏两端三角按钮与角落 */
  /* 右对齐列（rc-table 以内联 text-align 标记，对 flex 表头无效）：
		   排序表头的 [标题+图标] 组改用 flex-end 整体靠右 */
  /* antd 的 .ant-table-column-sorters::after 是覆盖整个表头单元格的透明点击遮罩（整格可点击排序），
		   它会拦截指针事件导致排序图标自身的 :hover 失效；关闭遮罩指针事件后（点击排序仍经 th 冒泡正常触发），
		   hover 高亮只响应图标区域，悬停标题文字不再变色 */
  /* 排序列：手型光标只在排序图标上，表头其余区域恢复默认箭头（点击任意位置仍可排序） */
}
.ant-table .ant-table-content::-webkit-scrollbar {
  width: 8px;
  height: 8px;
  background: transparent;
  border: none;
}
.ant-table .ant-table-content::-webkit-scrollbar-thumb {
  cursor: pointer;
  border-radius: 4px;

  background-color: #dfdfdf;
  background-clip: padding-box;
}

}

}

/* 应用级骨架样式 — token 消费 */
.app-root {
  height: 100vh;
  display: flex;
  flex-direction: column;
  background: var(--surface-container-lowest);
  color: var(--on-surface);
  font: var(--font-body-m);
  overflow: hidden;
}

/* 主内容区 */
.page-main {
  flex: 1 1 0;
  min-height: 0;
  display: flex;
  flex-direction: column;
  padding: var(--spacing-page);
}

/* 标题栏下方:左右布局,左侧固定 678px,间隔 24 */
.page-body {
  flex: 1 1 0;
  min-height: 0;
  display: flex;
  align-items: stretch;
  gap: var(--spacing-inset);
}

/* 卡片容器基准(Level 1:阴影 + 圆角,无描边) */
.panel {
  background: var(--surface-container-highest);
  border-radius: var(--radius-container);
  box-shadow: var(--shadow-card);
}


.header-bar {
  flex: none;
  height: 3rem;
  display: flex;
  align-items: center;
  gap: var(--spacing-gutter);
  padding: 0 var(--spacing-page);
  background: var(--surface-container-highest);
  border-bottom: 1px solid var(--divider);
}

/* ── 品牌区 ── */
.header-brand {
  display: flex;
  align-items: center;
  gap: var(--spacing-inline);
  flex: none;
}

.brand-logo {
  width: 2rem;
  height: 2rem;
  display: block;
}

.brand-name {
  font: var(--font-headline-s);
  font-weight: var(--font-weight-semibold);
  color: var(--on-surface);
  letter-spacing: 0.01em;
  white-space: nowrap;
}

/* ── 顶部导航(原生 nav):未选中 2px 透明下划线占位,选中品牌色下划线 ── */
.header-nav {
  flex: 1;
  min-width: 0;
  height: 100%;
  display: flex;
  align-items: stretch;
  justify-content: center;
}

.nav-item {
  display: flex;
  align-items: center;
  padding: 0 var(--spacing-gutter);
  font: var(--font-body-m);
  color: var(--on-surface-variant);
  border-bottom: 2px solid transparent;
  white-space: nowrap;
  cursor: pointer;
  transition: color 0.2s ease;
}

.nav-item:hover {
  color: var(--color-brand);
}

.nav-item.active {
  color: var(--color-brand);
  border-bottom-color: var(--color-brand);
  font-weight: var(--font-weight-medium);
}

/* ── 右侧工具区 ── */
.header-actions {
  flex: none;
  display: flex;
  align-items: center;
  gap: var(--spacing-gutter);
}

.theme-toggle {
  color: var(--on-surface-variant);
}

.theme-toggle:hover {
  color: var(--color-brand);
}

/* 人头像轮廓图标(无外圈) */
.user-avatar {
  width: 2rem;
  height: 2rem;
  flex: none;
  display: grid;
  place-items: center;
  color: var(--on-surface-variant);
  cursor: pointer;
}

.user-avatar:hover {
  color: var(--color-brand);
}


.page-title {
  flex: none;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-bottom: var(--spacing-gutter);
}

.title-group {
  display: flex;
  align-items: center;
  gap: var(--spacing-gutter);
  min-width: 0;
}

/* 蜂窝阶段:返回箭头(< 形) */
.title-back {
  color: var(--on-surface-variant);
}

.title-back:hover {
  color: var(--color-brand);
}

/* 蜂窝阶段:开关状态胶囊(绿点=开启,灰点=关闭) */
.head-pill {
  display: inline-flex;
  align-items: center;
  gap: var(--spacing-1);
  padding: 0.125rem 0.625rem;
  border-radius: var(--radius-full);
  background: rgb(from var(--gray-05) r g b / 0.2);
  font: var(--font-caption-m);
  color: var(--on-surface-variant);
  white-space: nowrap;
}

.head-dot {
  width: 0.5rem;
  height: 0.5rem;
  flex: none;
  border-radius: var(--radius-full);
}

.head-dot.on {
  background: var(--color-success);
}

.head-dot.off {
  background: var(--color-none);
}

.title-text {
  font-size: var(--font-size-4xl); /* 28px */
  line-height: var(--line-height-xs);
  font-weight: var(--font-weight-semibold);
  color: var(--on-surface);
  white-space: nowrap;
}

/* ── 右侧动作区:更新时间 + 刷新图标 + 策略按钮(图标与文本隔 8px,与按钮隔 16px) ── */
.title-actions {
  display: flex;
  align-items: center;
  gap: var(--spacing-gutter);
}

.update-time {
  display: inline-flex;
  align-items: center;
  gap: var(--spacing-2);
  font: var(--font-body-m); /* 14px */
  color: var(--on-surface-variant);
  white-space: nowrap;
}

.update-refresh {
  color: var(--on-surface-variant);
}

.update-refresh:hover {
  color: var(--color-brand);
}

/* ── 节能策略弹窗 ── */
.strategy-tip {
  font: var(--font-body-s);
  color: var(--on-surface-variant);
  line-height: var(--line-height-md);
  margin-bottom: var(--spacing-stack);
}

.strategy-list {
  display: flex;
  flex-direction: column;
}

.strategy-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--spacing-gutter);
  padding: var(--spacing-stack) 0;
  border-bottom: 1px solid var(--divider);
}

.strategy-row:last-child {
  border-bottom: none;
}

.strategy-info {
  display: flex;
  flex-direction: column;
  gap: var(--spacing-1);
  min-width: 0;
}

.strategy-name {
  font: var(--font-body-m);
  font-weight: var(--font-weight-medium);
  color: var(--on-surface);
}

.strategy-desc {
  font: var(--font-body-s);
  color: var(--on-surface-variant);
}


/* 左侧:今日用能总览 — 无背景整体信息块(标题栏 + 总能耗 + 三项指标 + 集群气泡/列表) */
.energy-left {
  flex: none;
  width: 678px;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: var(--spacing-gutter);
  overflow: hidden;
}

/* ── 标题栏 ── */
.left-head {
  flex: none;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--spacing-gutter);
  min-height: 1.75rem;
}

.left-title {
  display: flex;
  align-items: center;
  gap: var(--spacing-inline);
  font: var(--font-headline-m);
  font-weight: var(--font-weight-semibold);
  color: var(--on-surface);
  white-space: nowrap;
}

.title-zap {
  color: var(--icon-success);
}

.left-actions {
  display: flex;
  align-items: center;
  gap: var(--spacing-2);
}

.left-action-icon {
  color: var(--on-surface-variant);
}

.left-action-icon:hover {
  color: var(--color-brand);
}

/* ── 信息栏:今日总能耗数值(无背景;与「今日用能总览」文字视觉对齐) ── */
.summary-bar {
  flex: none;
  padding-left: 1.5rem;
}

.summary-value {
  font: var(--font-display-s);
  color: var(--on-surface);
  line-height: var(--line-height-xs);
}

.summary-unit {
  font: var(--font-body-s);
  color: var(--on-surface-variant);
  margin-left: var(--spacing-1);
}

/* ── 信息栏:三项用能指标(无背景,项间竖线分割;首项居左,后两项居中) ── */
.stat-bar {
  flex: none;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
}

.stat-item {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: var(--spacing-2);
  padding: 0 var(--spacing-4);
}

.stat-item:first-child {
  padding-left: 0;
}

.stat-item:last-child {
  padding-right: 1.25rem; /* 末项整体左移 20px */
}

/* 项间竖线分割;三项统一居左 */
.stat-item + .stat-item {
  border-left: 1px solid var(--divider);
}

/* 蜂窝状态第 3 项的 "|" 分隔符 */
.stat-pipe {
  color: var(--on-surface-variant);
  font-weight: var(--font-weight-normal);
  margin: 0 0.25em;
}

/* 蜂窝状态第 3 项的 "|" 分隔符 */
.stat-pipe {
  color: var(--on-surface-variant);
  font-weight: var(--font-weight-normal);
  margin: 0 0.25em;
}

.stat-item:nth-child(2) {
  align-items: center;
}

/* 第1、2项的数字行左缩进(视觉对齐上方文本) */
.stat-item:nth-child(1) .stat-value-row,
.stat-item:nth-child(2) .stat-value-row {
  padding-left: 2.125rem;
}

.stat-item:nth-child(3) {
  align-items: flex-end;
}

.stat-head {
  display: flex;
  align-items: center;
  gap: var(--spacing-inline);
}

/* 指标图标统一绿色 */
.stat-icon {
  color: var(--icon-success);
}

.stat-label {
  font: var(--font-body-s);
  color: var(--on-surface-variant);
}

/* 三项数值行统一左缩进,与上方文本(图标右侧)对齐 —— 常态与蜂窝态第3项同规则 */
.stat-value-row {
  display: flex;
  align-items: baseline;
  gap: var(--spacing-1);
  padding-left: 1.875rem;
}

/* 第 1 项图标视觉留白不同,单独再左移微调 */
.stat-item:nth-child(1) .stat-value-row {
  padding-left: 1.625rem;
}

.stat-unit {
  font: var(--font-caption-m);
  color: var(--on-surface-variant);
}

/* 数字固定 28px */
.stat-value {
  font-size: var(--font-size-3xl); /* 数字 24px */
  line-height: var(--line-height-xs);
  color: var(--on-surface);
  white-space: nowrap;
}

.stat-unit {
  font: var(--font-caption-m);
  color: var(--on-surface-variant);
}

/* ── 集群气泡(拓扑视图):大球居中,小球四周环绕,球间留距 ── */
/* 最上方球顶距信息栏 ≈70px(43 margin + 16 父级 gap + 4 padding + 7 舞台内偏移);不出滚动条 */
.bubble-field {
  flex: 1 1 0;
  min-height: 0;
  display: flex;
  overflow: hidden;
  margin-top: 2.6875rem;
  padding: var(--spacing-1);
}

/* 固定舞台:球心 (x,y) 以舞台中心为原点,顶部对齐(横向居中),尺寸随 rem 等比缩放 */
.bubble-stage {
  position: relative;
  flex: none;
  width: 41rem;
  height: 35rem;
  margin: 0 auto;
}

.bubble {
  position: absolute;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0.125rem;
  padding: 0.25rem;
  border-radius: var(--radius-full);
  text-align: center;
  cursor: pointer;
  transform: translate(-50%, -50%);
  /* 点击展开:点击球渐隐 / 其余球离心飞散(内联样式驱动过渡) */
  transition: transform 0.65s ease-out, opacity 0.65s ease-out;
}

/* hover:不放大;SVG 反光光斑 —— 真实穹顶形(中间厚两端薄、内部渐暗、柔边),随旋转游走 */
.roam-svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.3s ease;
  /* 旋转常驻:离开时只淡出、角度不回弹,避免"闪现 4 个"的跳变 */
  animation: bubble-rim-run 6s linear infinite;
}

/* 光弧颜色:浅色深灰,深色亮白 */
.roam-stop {
  stop-color: #4a4a4a;
}

.dark .roam-stop {
  stop-color: #ffffff;
}

/* 同心弧光纹描边色(跟随明暗模式) */
.roam-stroke {
  stroke: #4a4a4a;
}

.dark .roam-stroke {
  stroke: #ffffff;
}

/* 关闭球:静态底色为亮灰半透光,白斑对比不足 ——
   brightness 对纯白无效,改用白色辉光外晕增强可见度(配合 JSX 叠层) */
.bubble.off .roam-svg {
  filter: drop-shadow(0 0 0.25rem rgb(255 255 255 / 0.7));
}

/* hover 底衬:整个圆周淡淡的柔光 —— 自身径向渐变向圆周渐亮,无硬边 */
.bubble::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: var(--radius-full);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
  background: radial-gradient(
    circle,
    transparent 0 58%,
    rgb(from var(--gray-90) r g b / 0.05) 63%,
    rgb(from var(--gray-90) r g b / 0.13) 66.5%,
    rgb(from var(--gray-90) r g b / 0.2) 69%,
    rgb(from var(--gray-90) r g b / 0.25) 71%
  );
}

.dark .energy-left .bubble::after {
  background: radial-gradient(
    circle,
    transparent 0 58%,
    rgb(from var(--gray-0) r g b / 0.05) 63%,
    rgb(from var(--gray-0) r g b / 0.13) 66.5%,
    rgb(from var(--gray-0) r g b / 0.2) 69%,
    rgb(from var(--gray-0) r g b / 0.25) 71%
  );
}

.bubble:hover {
  z-index: 1;
}

.bubble:hover .roam-svg {
  opacity: 1;
}

.bubble:hover::after {
  opacity: 1;
}

@keyframes bubble-rim-run {
  to {
    transform: rotate(360deg);
  }
}

/* ── 蜂窝下方左右信息条 ── */
.honey-foot {
  position: absolute;
  top: 43.25rem;
  left: 0;
  right: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--spacing-gutter);
}

/* 条体:8px 圆角(非胶囊),#1d1d1d 底 */
.foot-bar {
  display: inline-flex;
  align-items: center;
  gap: var(--spacing-2);
  height: 2rem;
  padding: 0 0.875rem;
  border-radius: 0.5rem;
  background: #1d1d1d;
  white-space: nowrap;
}

/* 方形背景的时钟图标 */
.foot-clock {
  width: 1.5rem;
  height: 1.5rem;
  flex: none;
  display: grid;
  place-items: center;
  border-radius: var(--radius-base);
  background: rgb(from var(--gray-05) r g b / 0.3);
  color: var(--on-surface-variant);
}

.foot-label {
  font: var(--font-caption-m);
  color: var(--on-surface-variant);
}

.foot-value {
  font: var(--font-caption-m);
  font-weight: var(--font-weight-medium);
  color: var(--on-surface);
}

.foot-unit {
  font-size: var(--font-size-sm);
  color: var(--on-surface-variant);
}

/* 4 段色标:每段 40×8、间隔 2px;两端胶囊圆角,中段无圆角,颜色内联 */
.foot-scale {
  display: inline-flex;
  gap: 2px;
  flex: none;
  height: 0.5rem;
}

.foot-scale .seg {
  flex: none;
  width: 2.5rem; /* 每段长 40 */
}

.foot-scale .seg:first-child {
  border-radius: var(--radius-full) 0 0 var(--radius-full);
}

.foot-scale .seg:last-child {
  border-radius: 0 var(--radius-full) var(--radius-full) 0;
}

.foot-max {
  font: var(--font-caption-m);
  color: var(--on-surface-variant);
}

.foot-more {
  cursor: pointer;
  font: var(--font-caption-m);
  color: var(--on-surface);
  transition: filter 0.2s ease;
}

.foot-more:hover {
  filter: brightness(1.3);
}

/* 标题:不换行;start 弹性裁剪 + end 固定末字 → 超宽时中间省略(如 逻...K) */
.bubble-name {
  display: flex;
  justify-content: center;
  min-width: 0;
  max-width: 100%;
  font: var(--font-caption-s); /* 62: 10px */
  color: var(--color-text-inverse);
  line-height: 1.3;
}

.bubble-name .name-start {
  flex: 0 1 auto;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.bubble-name .name-end {
  flex: none;
  white-space: nowrap;
}

/* 描述(今日总能耗):与标题间距 16px;14px(仅 218/296 显示) */
.bubble-desc {
  font-size: var(--font-size-md);
  color: rgb(from var(--gray-0) r g b / 0.85);
  line-height: 1.3;
  white-space: nowrap;
}

.bubble-name + .bubble-desc {
  margin-top: calc(1rem - 0.125rem);
}

.bubble-value {
  font: var(--font-caption-m);
  color: var(--color-text-inverse);
  line-height: 1.3;
  white-space: nowrap;
}

.bubble-unit {
  font-size: 0.75em;
  opacity: 0.85;
}

/* ── 分级内容与字号:140(md) 标题+数字;218(lg) 标题+描述+数字;296(xl) 完整结构 ──
   296 规格:标题 16 / 描述 14 / 数字 48 / 细节文字 14 / 细节数字 24;小球等比缩小 */
.bubble.md .bubble-name {
  font: var(--font-body-s);
  font-weight: var(--font-weight-medium);
}

.bubble.md .bubble-value {
  font-size: var(--font-size-lg);
  line-height: var(--line-height-xs);
}

.bubble.lg .bubble-name {
  font: var(--font-body-m);
  font-weight: var(--font-weight-semibold);
}

.bubble.lg .bubble-value {
  font-size: var(--font-size-5xl);
  line-height: var(--line-height-xs);
}

.bubble.xl .bubble-name {
  font: var(--font-body-l);
  font-weight: var(--font-weight-semibold);
}

.bubble.xl .bubble-value {
  font-size: var(--font-size-6xl);
  line-height: var(--line-height-xs);
}

/* xl 细节行:左右两项,每项上标签(14)下数值(24) */
.bubble-detail {
  display: flex;
  align-items: flex-start;
  gap: var(--spacing-6);
  margin-top: calc(0.75rem - 0.125rem);
  white-space: nowrap;
}

.detail-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.125rem;
}

.detail-label {
  font-size: var(--font-size-md);
  line-height: 1.3;
  color: rgb(from var(--gray-0) r g b / 0.8);
}

.detail-value {
  font-size: var(--font-size-4xl);
  line-height: var(--line-height-xs);
  color: var(--color-text-inverse);
}

/* ── 气泡状态 ──
   开启:淡绿球体 + 中心节能叶子水印 + 边缘白色光韵;
   关闭:背景全透明,仅边缘白色光韵(由外向内渐淡,约 1/3 半径处消失,不进入中心) */
/* 开启:半透明淡绿球体(通透感) + 圆周明亮的白绿光韵(加宽加亮,圆周实色) + 淡叶子水印 */
.bubble.on {
  background:
    radial-gradient(
      circle,
      transparent 0 47%,
      rgb(63 198 174 / 0.06) 52%,
      rgb(63 198 174 / 0.11) 57%,
      rgb(63 198 174 / 0.21) 61%,
      rgb(63 198 174 / 0.3) 64%,
      rgb(63 198 174 / 0.4) 66.5%,
      rgb(63 198 174 / 0.5) 68%,
      rgb(63 198 174 / 0.56) 69.5%,
      rgb(63 198 174 / 0.63) 71%,
      rgb(63 198 174 / 0.63) 100%
    ),
    radial-gradient(
      circle at 32% 28%,
      rgb(31 57 45 / 0.9),
      rgb(17 39 30 / 0.88) 55%,
      rgb(14 33 25 / 0.82) 100%
    );
  box-shadow: inset 0 0 0.5rem rgb(63 198 174 / 0.4);
}

/* 关闭:整体亮度提升;圆周 ~2px 区缓升到很亮(非突变实线),内侧自然过渡 */
.bubble.off {
  background: radial-gradient(
    circle,
    transparent 0 20%,
    rgb(from var(--gray-90) r g b / 0.04) 28%,
    rgb(from var(--gray-90) r g b / 0.09) 37%,
    rgb(from var(--gray-90) r g b / 0.17) 48%,
    rgb(from var(--gray-90) r g b / 0.37) 59%,
    rgb(from var(--gray-90) r g b / 0.61) 65.5%,
    rgb(from var(--gray-90) r g b / 0.78) 68.5%,
    rgb(from var(--gray-90) r g b / 0.88) 70.7%,
    rgb(from var(--gray-90) r g b / 0.88) 100%
  );
  box-shadow: inset 0 0 0.375rem rgb(from var(--gray-90) r g b / 0.5);
}

/* 浅色下关闭球无背景,文字改深色保证可读 */
.bubble.off .bubble-name,
.bubble.off .bubble-desc,
.bubble.off .bubble-value,
.bubble.off .detail-label,
.bubble.off .detail-value {
  color: var(--color-text-primary);
}

.dark .energy-left .bubble.off {
  background: radial-gradient(
    circle,
    transparent 0 20%,
    rgb(from var(--gray-20) r g b / 0.06) 28%,
    rgb(from var(--gray-20) r g b / 0.13) 37%,
    rgb(from var(--gray-20) r g b / 0.23) 48%,
    rgb(from var(--gray-20) r g b / 0.44) 59%,
    rgb(from var(--gray-20) r g b / 0.68) 65.5%,
    rgb(from var(--gray-20) r g b / 0.84) 68.5%,
    rgb(from var(--gray-20) r g b / 0.92) 70.7%,
    rgb(from var(--gray-20) r g b / 0.92) 100%
  );
  box-shadow: inset 0 0 0.375rem rgb(from var(--gray-20) r g b / 0.55);
}

.dark .energy-left .bubble.off .bubble-name,
.dark .energy-left .bubble.off .bubble-desc,
.dark .energy-left .bubble.off .bubble-value,
.dark .energy-left .bubble.off .detail-label,
.dark .energy-left .bubble.off .detail-value {
  color: var(--color-text-inverse);
}

/* 节能叶子水印:居中垫底(负层级,位于球体之上、文字之下),随球径等比缩放,统一左右镜像 */
.bubble-leaf {
  position: absolute;
  inset: 24%;
  z-index: -1;
  opacity: 0.18;
  color: var(--gray-0);
  transform: scaleX(-1);
  pointer-events: none;
}

.bubble-leaf svg {
  width: 100%;
  height: 100%;
  fill: currentColor;
}

/* ── 集群卡片(列表视图):垂直分布,占满宽度,16px 圆角,#191919 底 ── */
.cluster-cards {
  flex: 1 1 0;
  min-height: 0;
  display: flex;
  flex-direction: column;
  gap: var(--spacing-gutter);
  overflow-y: auto;
  padding: var(--spacing-0-5) var(--spacing-2) var(--spacing-0-5) 0;
}

/* 滚动条右移(卡片右侧留 8px),滚动条颜色 #595959 */
.cluster-cards::-webkit-scrollbar {
  width: 6px;
}

.cluster-cards::-webkit-scrollbar-thumb {
  background: var(--gray-60); /* #595959 */
  border-radius: var(--radius-full);
}

.cluster-cards::-webkit-scrollbar-track {
  background: transparent;
}

.cluster-card {
  flex: none;
  display: flex;
  flex-direction: column;
  gap: var(--spacing-3);
  padding: var(--spacing-4);
  background: var(--gray-90); /* #191919 */
  border-radius: 1rem; /* 16px */
  cursor: pointer;
  transition: filter 0.2s ease;
}

.cluster-card:hover {
  filter: brightness(1.15);
}

/* 标题栏:开关图标+名称(与下方指标行左对齐) | 状态胶囊 */
.card-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.card-title {
  display: inline-flex;
  align-items: center;
  gap: var(--spacing-2);
}

.card-switch {
  width: 1.25rem;
  height: 1.25rem;
  flex: none;
  display: block;
}

.card-name {
  font: var(--font-body-m);
  font-weight: var(--font-weight-semibold);
  color: var(--on-surface);
}

/* 状态胶囊:开启=绿叶图标+文本,关闭=灰点+文本;底色 #f3f3f3 带 20% 透明度 */
.status-pill {
  display: inline-flex;
  align-items: center;
  gap: var(--spacing-1);
  padding: 0.125rem 0.625rem;
  border-radius: var(--radius-full);
  background: rgb(from var(--gray-05) r g b / 0.2);
  font: var(--font-caption-m);
  color: var(--on-surface-variant);
  white-space: nowrap;
}

.pill-leaf {
  color: var(--icon-success);
}

.pill-dot {
  width: 0.5rem;
  height: 0.5rem;
  flex: none;
  border-radius: var(--radius-full);
  background: var(--color-none);
}

/* 四项描述:均分一行,每项上下文本 */
.card-stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: var(--spacing-gutter);
}

.card-stat {
  display: flex;
  flex-direction: column;
  gap: var(--spacing-1);
}

.stat-caption {
  font: var(--font-caption-m);
  color: var(--on-surface-variant);
}

.stat-figure {
  font-size: var(--font-size-3xl); /* 数字 24px */
  line-height: var(--line-height-xs);
  font-weight: var(--font-weight-medium);
  color: var(--on-surface);
  white-space: nowrap;
}

/* 单位:12px 小号,与数字留隙 */
.stat-unit {
  font-size: var(--font-size-base);
  color: var(--on-surface-variant);
  margin-left: 0.25em;
}

/* ── 拓扑主体区:气泡层与蜂窝层叠加交叉过渡的舞台 ── */
.topo-body {
  position: relative;
  flex: 1 1 0;
  min-height: 0;
  display: flex;
  flex-direction: column;
}

/* ── 蜂窝矩阵(点击集群飞散后,从中心向外波纹式呈现) ──
   单元 48×48、尖角朝上、间隙 10;共 14 行,四色按 4/4/4/2 行分段(颜色内联);
   绝对定位叠加在气泡层之上,实现交叉过渡 */
.honey-wrap {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  flex: none;
  width: 41rem;
  height: 41.875rem;
  margin: 0 auto;
}

.honey-cell {
  position: absolute;
  width: 3rem;   /* 48×48,尖角朝上(六边形由 ::after 裁剪呈现) */
  height: 3rem;
  display: flex;
  align-items: center;
  justify-content: center;
  /* 入场淡入;颜色闪变波挂在 .honey-hex 上 */
  animation: honey-in 0.32s ease-out both;
  transition: filter 0.2s ease;
  cursor: default;
}

/* 六边形本体:正比例(宽高比 0.866,修正压扁)+ 圆角,经 SVG clipPath 裁剪;
   波扫过时底色闪变;选中白纱 ::after 同被裁剪 */
.honey-hex {
  position: absolute;
  inset: 0;
  clip-path: url(#hexClip);
  animation: honey-tint 0.26s ease-out;
}

/* 颜色闪变:仅定义峰值帧(原色轻微提亮,色相不变),0%/100% 自动取原状态 */
@keyframes honey-tint {
  35% {
    filter: brightness(1.35);
  }
}

    () => svgCache.get(`${name}&${variant}&${effectiveColor}&${size}`) || ""
  );

    // 主题切换时 <html> class 变化不会触发 React 重渲染，需 MutationObserver 主动监听。
  // antd Button 等组件有 transition: color 0.2s，getComputedStyle 在 transition 期间返回中间色值；
  // 立即读一次覆盖无 transition 的图标，200ms 后再读一次覆盖 Button 等带 transition 的图标。
  // 仅 icon-plus 模式（plus 就绪、非 src 资源、无显式 color）才挂观察者，依赖变化时重建
  useEffect(() => {
    if (src || plus !== true || color) return;
    const readColor = () => {
      const el = wrapRef.current;
      if (!el) return;
      const hex = rgbToHex(getComputedStyle(el).color);
      if (hex) setInheritedColor(function (prev) { return hex !== prev ? hex : prev; });
    };
    let timer = null;
    const observer = new MutationObserver(() => {
      readColor();
      if (timer) clearTimeout(timer);
      timer = setTimeout(readColor, 300);
    });
    observer.observe(document.documentElement, { attributes: true, attributeFilter: ['class'] });
    return function () {
      observer.disconnect();
      if (timer) clearTimeout(timer);
    };
  }, [plus, src, color]);

  useEffect(() => {
    if (src) return; // user-asset mode: no network needed
    let alive = true;
    ensurePlus().then((ok) => {
      if (!alive) return;
      setPlus(ok);
      if (!ok) return; // getConfig probe failed → Lucide branch
      const key = `${name}&${variant}&${effectiveColor}&${size}`;
      if (svgCache.has(key)) {
        setSvg(svgCache.get(key));
        return;
      }
      fetchSvg(name, variant, effectiveColor, size).then((s) => {
        if (!alive || !s) return; // 空结果（失败）不写入 state，允许下次重试
        setSvg(s);
      });
    });
    return () => {
      alive = false;
    };
  }, [src, name, variant, effectiveColor, size]);

  // user-provided asset (svg/png/jpg) via relative path — overrides name when both are set
  if (src) {
    return React.createElement("img", {
      src: src,
      id,
      width: resolvedSize,
      height: resolvedSize,
      className: className,
      alt: "",
      "aria-hidden": true,
      onClick,
      title,
      style: { ...mergedStyle, display: "inline-block", verticalAlign: "middle" },
    });
  }

  // probe not finished yet → render nothing
  if (plus === null) return null;

  // icon-plus unavailable (offline) → Lucide fallback (original behavior)
  if (plus === false) {
    const nodes = lookupIcon(name);
    if (!nodes) return null;
    return React.createElement(
      "svg",
      {
        xmlns: "http://www.w3.org/2000/svg",
        width: resolvedSize,
        height: resolvedSize,
        viewBox: "0 0 24 24",
        fill: "none",
        strokeWidth: strokeWidth,
        strokeLinecap: "round",
        strokeLinejoin: "round",
        className: className,
        "aria-hidden": true,
        id,
        onClick,
        title,
        style: { ...mergedStyle, stroke: color || "currentColor" },
      },
      nodes.map(([tag, attrs], i) =>
        React.createElement(tag, { key: i, ...attrs })
      )
    );
  }

  // icon-plus available → render fetched SVG text as-is (only width/height on the wrapper)
  if (!svg) {
    return React.createElement("span", {
      ref: wrapRef,
      id,
      className,
      "aria-hidden": true,
      onClick,
      title,
      style: { ...mergedStyle, width: resolvedSize, height: resolvedSize },
    });
  }

  return React.createElement("span", {
    ref: wrapRef,
    id,
    className,
    "aria-hidden": true,
    onClick,
    title,
    style: { ...mergedStyle, width: resolvedSize, height: resolvedSize },
    dangerouslySetInnerHTML: { __html: svg },
  });
}
  Object.assign(__export, { Icon });
})();

(function () {
  const { useEffect, useState } = React;
  const { Icon } = __export;
// 蜂窝矩阵:点击集群气泡飞散后,从点击位置向外逐步呈现的节点矩阵
// 单元 48×48(设计画布 px),尖角朝上的正六边形(宽高比 0.866,修正原压扁感),
// 圆角 ~3px(SVG clipPath 裁剪),单元间隙 ~10;
// 共 14 行,四种背景色自上而下按 4/4/4/2 行分段:
// #34b787 → #268763 → #1b6148 → #113b2e;末格(300+)单独 #1c1c1c
const COLS = 11;
const ROWS = 14;
const COL_STEP = 50;  // 正六边形宽 41.6 + 8.4 间隙(收紧后)
const ROW_STEP = 44;  // 48 × 3/4 + 8 间隙(尖顶蜂窝错行咬合,收紧后)
const ROW_OFFSET = 25; // 奇数行右移半列
const START_X = 34;   // 网格整体右移 10(原 24)
const START_Y = 24;   // 整体下移 20(原 4)
const ROW_COLORS = ["#34b787", "#268763", "#1b6148", "#113b2e"];
const LAST_CELL_COLOR = "#1c1c1c";

// 点击位置(气泡舞台中心系坐标)→ 蜂窝容器坐标系偏移:
// 气泡舞台与蜂窝容器同宽(656),水平中心对齐;x 偏移 328;
// 气泡舞台顶距信息栏 63+280=343,蜂窝容器顶距 16;y 偏移 327
const CLICK_OFF_X = 328;
const CLICK_OFF_Y = 327;

// 单元入场延迟系数(距点击位置每 px 延迟);适度节奏,球淡出时圆内蜂窝先行显现
const DELAY_PER_PX = 1.3;
// 光带延迟系数:略慢于入场 → 光波落后于扩展波,缀在其后扫过
const FLASH_PER_PX = 1.7;
// 圆内保持时长:与点击球淡出(0.18s)对齐,此后蒙版展开、蜂窝扩展出圆
const UNMASK_DELAY = 200;

const toRem = (px) => `${px / 16}rem`;

// 行号 → 背景色(4/4/4/2 分段);行中点(c≥半列)提前切换 →
// 色带边界错开:第二色从第 4 行中间开始变换,后续边界同理
function colorIndex(r, c) {
  return Math.min(3, Math.floor((r + (c >= COLS / 2 ? 1 : 0)) / 4));
}

// 生成蜂窝单元:位置 + 距点击位置的呈现延迟 + 行背景色 + 随机叶子 + 末格标记
function buildCells(clickX, clickY) {
  const cells = [];
  for (let r = 0; r < ROWS; r += 1) {
    for (let c = 0; c < COLS; c += 1) {
      const x = START_X + c * COL_STEP + (r % 2 ? ROW_OFFSET : 0);
      const y = START_Y + r * ROW_STEP;
      const isLast = r === ROWS - 1 && c === COLS - 1;
      // 单元中心到点击位置的距离决定入场先后;光带按更慢速率跟随
      const dist = Math.hypot(x + 24 - clickX, y + 24 - clickY);
      cells.push({
        key: `${r}-${c}`,
        x,
        y,
        delay: Math.round(dist * DELAY_PER_PX),
        fdelay: Math.round(dist * FLASH_PER_PX),
        color: isLast ? LAST_CELL_COLOR : ROW_COLORS[colorIndex(r, c)],
        isLast,
        leaf: !isLast && (c * 7 + r * 13) % 10 < 3,
        leafColor: "#ffffff",
      });
    }
  }
  return cells;
}

function Honeycomb({ origin }) {
  // 点击位置映射到蜂窝容器坐标
  const clickX = CLICK_OFF_X + (origin ? origin.x : 0);
  const clickY = CLICK_OFF_Y + (origin ? origin.y : 0);
  // 圆形蒙版:初始裁剪为点击球范围(圆消失前蜂窝不超出圆),球淡出后展开
  const [unmasked, setUnmasked] = useState(false);
  useEffect(() => {
    const t = window.setTimeout(() => setUnmasked(true), UNMASK_DELAY);
    return () => window.clearTimeout(t);
  }, []);
  // 选中单元:点击显示白色描边(再次点击取消)
  const [activeCell, setActiveCell] = useState(null);
  // 球半径(rem),设 4.5rem 下限:小球点击也先露出数格蜂窝,
  // 避免针尖蒙版 + 爆炸式扩张的突兀感(大球点击的展开节奏即基准)
  const ballR = origin ? Math.max(origin.size / 32, 4.5) : 0;
  const cells = buildCells(clickX, clickY);

  return (
    <div
      className="honey-wrap"
      style={{
        clipPath: `circle(${unmasked ? "45rem" : `${ballR}rem`} at ${toRem(clickX)} ${toRem(clickY)})`,
        transition: "clip-path 0.45s ease-out",
      }}
    >
      {/* 圆角正六边形裁剪定义(objectBoundingBox 单位,随元素尺寸缩放) */}
      <svg width="0" height="0" style={{ position: "absolute" }} aria-hidden="true">
        <defs>
          <clipPath id="hexClip" clipPathUnits="objectBoundingBox">
            <path d="M 0.5541 0.03125 L 0.8789 0.21875 Q 0.933 0.25 0.933 0.3125 L 0.933 0.6875 Q 0.933 0.75 0.8789 0.78125 L 0.5541 0.96875 Q 0.5 1 0.4459 0.96875 L 0.1211 0.78125 Q 0.067 0.75 0.067 0.6875 L 0.067 0.3125 Q 0.067 0.25 0.1211 0.21875 L 0.4459 0.03125 Q 0.5 0 0.5541 0.03125 Z" />
          </clipPath>
        </defs>
      </svg>
      {cells.map((cell) => (
        <div
          key={cell.key}
          className={`honey-cell${activeCell === cell.key ? " active" : ""}`}
          style={{
            left: toRem(cell.x),
            top: toRem(cell.y),
            animationDelay: `${cell.delay}ms`,
          }}
          onClick={() =>
            setActiveCell((k) => (k === cell.key ? null : cell.key))
          }
        >
          {/* 选中发光:白色辐射光晕 + 白色描边 + 表面白纱 */}
          {activeCell === cell.key && (
            <span className="honey-halo" aria-hidden="true" />
          )}
          {/* 点击选中:白色六边形描边(与本体同款圆角路径),距蜂窝约 2px */}
          {activeCell === cell.key && (
            <svg className="honey-outline" viewBox="0 0 100 100" aria-hidden="true">
              <path
                d="M 55.41 3.125 L 87.89 21.875 Q 93.3 25 93.3 31.25 L 93.3 68.75 Q 93.3 75 87.89 78.125 L 55.41 96.875 Q 50 100 44.59 96.875 L 12.11 78.125 Q 6.7 75 6.7 68.75 L 6.7 31.25 Q 6.7 25 12.11 21.875 L 44.59 3.125 Q 50 0 55.41 3.125 Z"
                fill="none"
                stroke="currentColor"
                strokeWidth="2.5"
              />
            </svg>
          )}
          {/* 六边形本体(底色),波扫过时颜色闪变(延迟 fdelay 滞后于入场) */}

            className="honey-hex"

            aria-hidden="true"

          {cell.leaf && (
            <span className="honey-leaf" style={{ color: cell.leafColor }} aria-hidden="true">
              {/* color 传入单元格底色:SVG 根描边即中脉线颜色,与背景统一 */}
              <Icon name="leaf" color={cell.color} />
            </span>
          )}
          {cell.isLast && (
            <span className="honey-more" style={{ color: "#8CC7FF" }}>
              300+
            </span>
          )}
        </div>
      ))}
    </div>
  );
}
  Object.assign(__export, { Honeycomb });

  const { Icon, useApp, energySummary, statItems, clusterList, buildingOptions } = __export;
  const Honeycomb = __export.Honeycomb;
// 左侧:今日用能总览 — 无背景整体信息块
// 结构:标题栏(绿色闪电 + 标题 | 过滤/排序/视图切换)
//     → 今日总能耗信息栏(纯文本两行)
//     → 三项指标信息栏(节省能耗/节能增益/纳管集群,竖线分割)
//     → 集群用能拓扑(大球居中,小球切线环绕) / 排行列表(列表)

// 设计画布 px → rem(1920 基准 1rem=16px),随视口等比缩放
const toRem = (px) => `${px / 16}rem`;

function EnergyLeft() {
  // 蜂窝源集群走全局状态:页首标题(返回箭头)与本视图共享
  const { honeyOrigin, setHoneyOrigin } = useApp();
  const [view, setView] = useState("拓扑");
  const [building, setBuilding] = useState("全部机楼");
  const [sortDesc, setSortDesc] = useState(true);

  // 拓扑点击展开:idle 气泡 → scatter(点击球渐隐/四周球离心飞散) → honeycomb 蜂窝矩阵
  // fading:气泡层是否仍在退场(蜂窝出现后保留至飞散结束,交叉过渡)
  const [phase, setPhase] = useState("idle");
  const [fading, setFading] = useState(false);

  // 页首返回箭头/切列表会清空 honeyOrigin,此处同步复位局部阶段
  useEffect(() => {
    if (!honeyOrigin && phase !== "idle") {
      setPhase("idle");
      setFading(false);
    }
  }, [honeyOrigin]);

  const handleBubbleClick = (c) => {
    if (phase !== "idle") return;
    setHoneyOrigin(c);
    // 点击瞬间蜂窝立即开始呈现:与点击球淡出/四周飞散同步进行,透过气泡即可见蜂窝
    setPhase("honeycomb");
    setFading(true);
    // 其余球飞散(0.55s + 距离错峰)结束后移除气泡层
    window.setTimeout(() => setFading(false), 900);
  };

  // 过滤(按机楼) + 排序(按能耗)
  const clusters = useMemo(() => {
    const list =
      building === "全部机楼"
        ? clusterList
        : clusterList.filter((c) => c.building === building);
    return [...list].sort((a, b) =>
      sortDesc ? b.energy - a.energy : a.energy - b.energy
    );
  }, [building, sortDesc]);

  const filterMenu = {
    items: buildingOptions.map((b) => ({ key: b, label: b })),
    onClick: ({ key }) => setBuilding(key),
  };

  return (
    <section className="energy-left">
      {/* 标题栏:绿色闪电 + 标题 | 过滤 / 排序 / 拓扑列表切换 */}
      <div className="left-head">
        <div className="left-title">
          <Icon name="zap" size="1.25rem" className="title-zap" />
          今日用能总览
        </div>
        <div className="left-actions">
          <Dropdown menu={filterMenu}>
            <Icon
              name="funnel"
              size="1rem"
              className="left-action-icon"
              title="按机楼筛选"
              onClick={(e) => e.preventDefault()}
            />
          </Dropdown>
          <Icon
            name={sortDesc ? "arrow-up-down" : "arrow-down-up"}
            size="1rem"
            className="left-action-icon"
            title={sortDesc ? "切换为能耗从低到高" : "切换为能耗从高到低"}
            onClick={() => setSortDesc((v) => !v)}
          />
          <Segmented
            options={["拓扑", "列表"]}
            value={view}
            onChange={(v) => {
              setView(v);
              if (v !== "拓扑") setHoneyOrigin(null);
            }}
          />
        </div>
      </div>

      {/* 信息栏:今日总能耗数值(与标题文字左对齐) */}
      <div className="summary-bar">
        <span className="summary-value">
          {energySummary.value}
          <span className="summary-unit">{energySummary.unit}</span>
        </span>
      </div>

      {/* 信息栏:三项用能指标;蜂窝状态下第 3 项改为 节能态|节点总数 */}
      <div className="stat-bar">
        {statItems.map((s, i) => {
          const honeyThird = honeyOrigin && i === 2;
          return (
            <div className="stat-item" key={s.key}>
              <div className="stat-head">
                <Icon name={honeyThird ? "server" : s.icon} size="1rem" className="stat-icon" />
                <span className="stat-label">
                  {honeyThird ? (
                    <>
                      节能态节点<span className="stat-pipe">|</span>节点总数
                    </>
                  ) : (
                    s.label
                  )}
                </span>
              </div>
              <div className="stat-value-row">
                {honeyThird ? (
                  <>
                    <span className="stat-value">213</span>
                    <span className="stat-pipe">|</span>
                    <span className="stat-value">{honeyOrigin.nodeCount}</span>
                    <span className="stat-unit">个</span>
                  </>
                ) : (
                  <>
                    <span className="stat-value">{s.value}</span>
                    <span className="stat-unit">{s.unit}</span>
                  </>
                )}
              </div>
            </div>
          );
        })}
      </div>

      {/* 集群用能:拓扑(大球居中,小球环绕;点击展开蜂窝) / 排行列表 */}
      {view === "拓扑" ? (
        <div className="topo-body">
          {/* 气泡层:蜂窝出现后仍保留至飞散结束(交叉过渡) */}
          {(phase !== "honeycomb" || fading) && (
            <div className="bubble-field">
            <div className="bubble-stage">
              {clusters.map((c) => {
                const isOrigin = honeyOrigin && c.id === honeyOrigin.id;
                // scatter 及其后的退场期:点击球渐隐;其余球沿离心方向飞散渐隐(按距离错峰)
                let animStyle = {};
                if (phase !== "idle") {
                  if (isOrigin) {
                    // 点击球:快速淡出(0.18s,快于四周飞散)
                    animStyle = { opacity: 0, transitionDuration: "0.18s", pointerEvents: "none" };
                  } else {
                    const dx = c.x - honeyOrigin.x;
                    const dy = c.y - honeyOrigin.y;
                    const len = Math.hypot(dx, dy) || 1;
                    animStyle = {
                      transform: `translate(-50%, -50%) translate(${Math.round((dx / len) * 420) / 16}rem, ${Math.round((dy / len) * 420) / 16}rem)`,
                      opacity: 0,
                      transitionDuration: "0.55s",
                      transitionDelay: `${Math.round(len * 0.2)}ms`,
                      pointerEvents: "none",
                    };
                  }
                }
                return (
                  <div
                    key={c.id}
                    className={`bubble ${c.on ? "on" : "off"} ${c.size >= 280 ? "xl" : c.size >= 200 ? "lg" : c.size >= 120 ? "md" : ""}`}
                    style={{
                      width: toRem(c.size),
                      height: toRem(c.size),
                      left: `calc(50% + ${toRem(c.x)})`,
                      top: `calc(50% + ${toRem(c.y)})`,
                      ...animStyle,
                    }}
                    onClick={() => handleBubbleClick(c)}
                  >
                    {/* 节能叶子水印(仅开启状态,垫在文字下方) */}
                    {c.on && (
                      <span className="bubble-leaf" aria-hidden="true">
                        <Icon name="leaf" />
                      </span>
                    )}
                    {/* 标题:全部显示;小球超宽时中间省略 */}
                    <span className="bubble-name">
                      <span className="name-start">{c.name.slice(0, -1)}</span>
                      <span className="name-end">{c.name.slice(-1)}</span>
                    </span>
                    {/* 描述:218 及以上 */}
                    {c.size >= 200 && <span className="bubble-desc">今日总能耗</span>}
                    {/* 数字:140 及以上 */}
                    {c.size >= 120 && (
                      <span className="bubble-value">
                        {c.energy.toLocaleString("zh-CN")}
                        <span className="bubble-unit"> kWh</span>
                      </span>
                    )}
                    {/* 细节行(节点数量 / 今日节省总能耗):仅最大球 */}
                    {c.size >= 280 && (
                      <div className="bubble-detail">

                          <span className="detail-label">节点数量</span>
                          <span className="detail-value">{c.nodeCount}个</span>
                        </div>
                        <div className="detail-item">
                          <span className="detail-label">今日节省总能耗</span>
                          <span className="detail-value">
                            {c.savedEnergy.toLocaleString("zh-CN")}
                            <span className="bubble-unit"> kWh</span>
                          </span>
                        </div>
                      </div>

                    {/* 反光光晕(SVG 椭圆柔光斑:贴圆周的镜面高光,径向自然消散,无任何硬边,对向双斑旋转游走) */}
                    <svg className={`roam-svg${c.on ? "" : " off"}`} viewBox="0 0 100 100" aria-hidden="true">
                      <defs>
                        {/* 快速过渡:贴圆周焦点处很明亮,向内梯度压缩、急剧衰减 */}
                        <radialGradient id={`rg-${c.id}`} fx="0.5" fy="0.06">
                          <stop offset="0" className="roam-stop" stopOpacity="1" />
                          <stop offset="0.15" className="roam-stop" stopOpacity="0.9" />
                          <stop offset="0.3" className="roam-stop" stopOpacity="0.55" />
                          <stop offset="0.5" className="roam-stop" stopOpacity="0.25" />
                          <stop offset="0.7" className="roam-stop" stopOpacity="0.08" />
                          <stop offset="1" className="roam-stop" stopOpacity="0" />
                        </radialGradient>
                        <filter id={`bl-${c.id}`} x="-30%" y="-30%" width="160%" height="160%">
                          <feGaussianBlur stdDeviation="0.4" />
                        </filter>
                        {/* 裁剪到圆内 */}
                        <clipPath id={`cp-${c.id}`}>
                          <circle cx="50" cy="50" r="49.5" />
                        </clipPath>
                      </defs>
                      <g clipPath={`url(#cp-${c.id})`}>
                        {/* 单一光斑:去亮核层,轻柔焦消层感;向内延伸 20% */}
                        <g filter={`url(#bl-${c.id})`}>
                          <ellipse cx="50" cy="3.9" rx="29" ry="5.4" fill={`url(#rg-${c.id})`} />
                        </g>
                        <g transform="rotate(180 50 50)" filter={`url(#bl-${c.id})`}>
                          <ellipse cx="50" cy="3.9" rx="29" ry="5.4" fill={`url(#rg-${c.id})`} />
                        </g>
                        {/* 关闭球:亮灰底上白斑对比不足,叠加一层翻倍增亮 */}
                        {!c.on && (
                          <g>
                            <g filter={`url(#bl-${c.id})`}>
                              <ellipse cx="50" cy="3.9" rx="29" ry="5.4" fill={`url(#rg-${c.id})`} />
                            </g>
                            <g transform="rotate(180 50 50)" filter={`url(#bl-${c.id})`}>
                              <ellipse cx="50" cy="3.9" rx="29" ry="5.4" fill={`url(#rg-${c.id})`} />
                            </g>
                          </g>
                        )}
                      </g>
                    </svg>
                  </div>
                );
              })}
            </div>
            </div>
          )}

          {/* 状态图例:气泡容器下方,居中(蜂窝阶段隐藏) */}
          {phase !== "honeycomb" && (
            <div className="legend-bar">
              <span className="legend-item">
                <span className="legend-dot on" />
                <span className="legend-text">已开启节能监控</span>
                <span className="legend-num">12</span>
              </span>
              <span className="legend-item">
                <span className="legend-dot off" />
                <span className="legend-text">未开启节能监控</span>
                <span className="legend-num">12</span>
              </span>
            </div>
          )}

          {/* 蜂窝层:点击球快消失时即开始呈现,叠加在气泡层之上交叉过渡 */}
          {phase === "honeycomb" && honeyOrigin && (
            <>
              <Honeycomb origin={honeyOrigin} />
              {/* 蜂窝下方:左(近24h总能耗 + 4段色标) / 右(查看更多) */}
              <div className="honey-foot">
                <div className="foot-bar">
                  <span className="foot-clock">
                    <Icon name="clock" size="0.875rem" />
                  </span>
                  <span className="foot-label">近24h总能耗</span>
                  <span className="foot-value">
                    0<span className="foot-unit"> kWh</span>
                  </span>
                  <span className="foot-scale">
                    <span className="seg" style={{ background: "#dff4cc" }} />
                    <span className="seg" style={{ background: "#8fe5c2" }} />
                    <span className="seg" style={{ background: "#abd881" }} />
                    <span className="seg" style={{ background: "#058358" }} />
                  </span>
                  <span className="foot-max">100 kWh</span>
                </div>
                <div
                  className="foot-bar foot-more"
                  onClick={() => message.info("正在加载更多节点…")}
                >
                  查看更多 300+ 节点
                </div>
              </div>
            </>
          )}
        </div>
      ) : (
        <div className="cluster-cards">
          {clusters.map((c) => {
            // 节能增益 = 节省能耗 / 总能耗
            const gain = (c.savedEnergy / c.energy) * 100;
            return (
              <div
                className="cluster-card"
                key={c.id}
                onClick={() => message.info(`正在查看「${c.name}」用能详情…`)}
              >
                {/* 标题栏:开关图标 + 名称(与下方指标左对齐) | 状态胶囊 */}
                <div className="card-head">
                  <span className="card-title">
                    <img
                      src={c.on ? "./assets/uploads/on.svg" : "./assets/uploads/off.svg"}
                      alt=""
                      className="card-switch"
                    />
                    <span className="card-name">{c.name}</span>
                  </span>
                  <span className={c.on ? "status-pill on" : "status-pill off"}>
                    {c.on ? (
                      <Icon name="leaf" size="0.75rem" className="pill-leaf" />
                    ) : (
                      <span className="pill-dot" />
                    )}
                    {c.on ? "已开启节能监控" : "未开启节能监控"}
                  </span>
                </div>
                {/* 四项描述:数字 24px / 单位 12px;关闭态的节省能耗/节能增益显示 -- */}
                <div className="card-stats">
                  <div className="card-stat">
                    <span className="stat-caption">节点数量</span>
                    <span className="stat-figure">
                      {c.nodeCount}
                      <span className="stat-unit">个</span>
                    </span>
                  </div>
                  <div className="card-stat">
                    <span className="stat-caption">今日总能耗</span>
                    <span className="stat-figure">
                      {c.energy.toLocaleString("zh-CN")}
                      <span className="stat-unit">kWh</span>
                    </span>
                  </div>
                  <div className="card-stat">
                    <span className="stat-caption">今日节省能耗</span>
                    <span className="stat-figure">
                      {c.on ? (
                        <>
                          {c.savedEnergy.toLocaleString("zh-CN")}
                          <span className="stat-unit">kWh</span>
                        </>
                      ) : (
                        "--"
                      )}
                    </span>
                  </div>
                  <div className="card-stat">
                    <span className="stat-caption">今日节能增益</span>
                    <span className="stat-figure">
                      {c.on ? (
                        <>
                          {gain.toFixed(2)}
                          <span className="stat-unit">%</span>
                        </>
                      ) : (
                        "--"
                      )}
                    </span>
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      )}
    </section>
  );
}
  Object.assign(__export, { EnergyLeft });
})();

// 0 线下柱的斑马纹纹理:离屏 canvas 绘制 15° 倾斜等宽条纹
// 返回 { image, repeat } 直接作为 itemStyle.color;无 canvas 环境兜底为纯色
function createZebraPattern(base, stripe) {
  try {
    const pCanvas = document.createElement("canvas");
    const pCtx = pCanvas.getContext("2d");
    if (!pCtx) return base;

    const angle = 15; // 倾斜角度 15°
    const rad = (angle * Math.PI) / 180;
    const stripeWidth = 2; // 条纹宽度(细)
    const gapWidth = 4; // 间隔宽度
    const period = stripeWidth + gapWidth;
    // 无缝平铺条件:W·sinθ = a·period 且 H·cosθ = b·period(a、b 为整数)。
    // 否则瓦片边界条纹错相 → 横向/纵向断裂。取 a=5,b=14 反解尺寸,舍入误差 <0.05px(亚像素,视觉无缝)
    const a = 5;
    const b = 14;
    const width = Math.round((a * period) / Math.sin(rad)); // = 116
    const height = Math.round((b * period) / Math.cos(rad)); // = 87

    pCanvas.width = width;
    pCanvas.height = height;
    // 填充底色
    pCtx.fillStyle = base;
    pCtx.fillRect(0, 0, width, height);
    // 绘制反向("／")15° 斜条纹
    pCtx.fillStyle = stripe;
    pCtx.save();
    pCtx.rotate(-rad);
    const diagonal = Math.sqrt(width * width + height * height) * 2;
    for (let y = -diagonal; y < diagonal; y += period) {
      pCtx.fillRect(-diagonal, y, diagonal * 2, stripeWidth);
    }
    pCtx.restore();
    return { image: pCanvas, repeat: "repeat" };
  } catch (e) {
    return base;
  }
}

// echarts 生命周期:init → setOption(notMerge) → dispose
// HUICharts 简化 schema 无法表达双 grid 分叉柱/纹理,故直接驱动 echarts 运行时
// renderer:趋势图用 canvas(支持 canvas 纹理),堆叠图用 svg(无 canvas 依赖)
function useEChart(elRef, buildOption, deps, renderer = "svg") {
  const chartRef = useRef(null);

  useEffect(() => {
    if (!elRef.current || typeof echarts === "undefined") return undefined;
    const chart = echarts.init(elRef.current, null, { renderer });
    chartRef.current = chart;

    let ro = null;
    if (typeof ResizeObserver !== "undefined") {
      ro = new ResizeObserver(() => chart.resize());
      ro.observe(elRef.current);
    }
    return () => {
      if (ro) ro.disconnect();
      chart.dispose();
      chartRef.current = null;
    };
  }, []);

  useEffect(() => {
    const chart = chartRef.current;
    if (chart) chart.setOption(buildOption(), true);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, deps);

  return chartRef;
}

// ── 节点闲忙:24 小时堆叠柱(灰底空闲 + 蓝顶运行) ─────────────
function StackedChart({ yName, max, interval, series, formatTick }) {
  const { isDark } = useApp();
  const elRef = useRef(null);

  useEChart(
    elRef,
    () => {
      const c = isDark ? DARK_PALETTE : LIGHT_PALETTE;
      return {
        grid: { left: 46, right: 10, top: 20, bottom: 24 },
        xAxis: {
          type: "category",
          data: series.map((d) => `${d.hour}:00`),
          axisTick: { show: false },
          axisLine: { show: false },
          axisLabel: { color: c.sub, fontSize: 11, interval: 2, margin: 8 }, // 0:00/3:00/…
        },
        yAxis: {
          type: "value",
          min: 0,
          max,
          interval,
          name: yName,
          nameLocation: "end",
          nameGap: 10,
          nameTextStyle: { color: c.sub, fontSize: 12, align: "left", padding: [0, 0, 0, -28] },
          axisLabel: { color: c.sub, fontSize: 11, formatter: formatTick },
          splitLine: { lineStyle: { type: "dashed", color: c.grid } },
          axisLine: { show: false },
          axisTick: { show: false },
        },
        series: [
          {
            name: "空闲态",
            type: "bar",
            stack: "total",
            barWidth: 12,
            data: series.map((d) => d.idle),
            itemStyle: { color: c.gray },
          },
          {
            name: "运行态",
            type: "bar",
            stack: "total",
            barWidth: 12,
            data: series.map((d) => d.running),
            itemStyle: { color: c.blue, borderRadius: [4, 4, 0, 0] },
          },
        ],
      };
    },
    [isDark]
  );

  return <div ref={elRef} className="er-schart" />;
}

}
